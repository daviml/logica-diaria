<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="description" content="Sinapse — Treino diário de lógica, casos de borda, trace em Python/C# e simulações interativas." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sinapse — Lógica Diária</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css?v=1" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="icon.svg" alt="Sinapse" class="brand-logo" />
        <div>
          <h1 class="brand-title">Sinapse</h1>
          <p class="brand-subtitle">Lógica diária · Python &amp; C#</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-sync-pill" class="sync-pill" type="button" title="Estado da sincronização">
          <span class="sync-dot"></span>
          <span id="sync-label">Local</span>
        </button>
        <button id="btn-theme" class="icon-btn" type="button" title="Alternar tema escuro/claro" aria-label="Alternar tema">
          ☀
        </button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Banner do Check Diário -->
    <section id="daily-banner" class="daily-banner" aria-label="Check diário e ofensiva"></section>

    <!-- Conteúdo dinâmico da aba -->
    <div id="app-content" aria-live="polite"></div>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <div class="bottom-nav-inner">
      <button class="nav-tab active" data-tab="hoje" type="button">
        <span class="nav-tab-icon">⚡</span>
        <span>Hoje</span>
      </button>
      <button class="nav-tab" data-tab="lab" type="button">
        <span class="nav-tab-icon">🧪</span>
        <span>Lab</span>
      </button>
      <button class="nav-tab" data-tab="explorar" type="button">
        <span class="nav-tab-icon">📚</span>
        <span>Explorar</span>
      </button>
      <button class="nav-tab" data-tab="progresso" type="button">
        <span class="nav-tab-icon">📊</span>
        <span>Progresso</span>
      </button>
    </div>
  </nav>

  <!-- Modal rápido: Check Codewars (PC) -->
  <div id="modal-codewars" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="cw-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <span class="pill pill-violet">Treino no PC</span>
          <h2 id="cw-modal-title" class="modal-title">Registrar kata do Codewars</h2>
        </div>
        <button id="btn-cw-close" class="icon-btn" type="button" aria-label="Fechar">✕</button>
      </div>
      <p class="muted-text">Marque o kata que você resolveu hoje no PC sem precisar abrir outro site.</p>
      <div class="cw-lang-row">
        <button type="button" class="cw-lang-btn active" data-cw-lang="python">🐍 Python</button>
        <button type="button" class="cw-lang-btn" data-cw-lang="csharp">🟣 C# (.NET)</button>
      </div>
      <label class="field-label" for="cw-note-input">Nome ou nível do kata (opcional)</label>
      <input id="cw-note-input" class="text-input" type="text" maxlength="60" placeholder="Ex.: 7 kyu — Two Sum / Vowel Count" />
      <div class="modal-actions">
        <button id="btn-cw-cancel" class="btn btn-ghost" type="button">Cancelar</button>
        <button id="btn-cw-save" class="btn btn-primary" type="button">Salvar Check Codewars</button>
      </div>
    </div>
  </div>

  <!-- Modal rápido: Bug Real (Minha Hipótese x Causa Real) -->
  <div id="modal-bug" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="bug-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <span class="pill pill-amber">Prática no trabalho</span>
          <h2 id="bug-modal-title" class="modal-title">🐛 Hipótese × Causa Real</h2>
        </div>
        <button id="btn-bug-close" class="icon-btn" type="button" aria-label="Fechar">✕</button>
      </div>
      <p class="muted-text" style="margin:0 0 0.4rem;">Pensou 5 min antes de abrir a IA? Registre e ganhe o Check de hoje.</p>
      <label class="field-label" for="bug-title-input">Bug / Sintoma curto</label>
      <input id="bug-title-input" class="text-input" type="text" maxlength="70" placeholder="Ex.: Rota retornando 500 com filtro vazio" />
      <label class="field-label" for="bug-hyp-input">Minha hipótese (antes da IA)</label>
      <textarea id="bug-hyp-input" class="textarea-input" rows="2" maxlength="220" placeholder="O que eu achei que estava quebrando e por quê"></textarea>
      <label class="field-label" for="bug-real-input">Causa real descoberta (opcional agora)</label>
      <textarea id="bug-real-input" class="textarea-input" rows="2" maxlength="220" placeholder="O que realmente causava o bug"></textarea>
      <label class="field-label">Acertei minha hipótese?</label>
      <div class="bug-outcome-row">
        <button type="button" class="cw-lang-btn active" data-bug-outcome="hit">✅ Na mosca</button>
        <button type="button" class="cw-lang-btn" data-bug-outcome="close">🟨 Perto</button>
        <button type="button" class="cw-lang-btn" data-bug-outcome="miss">❌ Errei</button>
      </div>
      <div class="modal-actions">
        <button id="btn-bug-cancel" class="btn btn-ghost" type="button">Cancelar</button>
        <button id="btn-bug-save" class="btn btn-primary" type="button">Salvar &amp; Check ✅</button>
      </div>
    </div>
  </div>

  <!-- Toast de feedback -->
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="js/challenges.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
